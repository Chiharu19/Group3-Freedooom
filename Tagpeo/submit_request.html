
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submit Booking Request</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="dashboard.css">
</head>
<body>

<!-- Sidebar Toggle for Mobile -->
<input type="checkbox" id="sidebar-toggle">
<label for="sidebar-toggle" class="sidebar-toggle-label">&#9776; Menu</label>

<div class="wrapper">
    <div class="sidebar">
        <h3 class="text-center mt-3 mb-4">Student</h3>
        <a href="dashboard.html">Dashboard</a>
        <a href="room_availability.html">Rooms</a>
        <a href="submit_request.html" class="active">Submit Booking</a>
        <a href="my_requests.html">My Requests</a>
        <a href="login.html">Logout</a>
    </div>

    <div class="main-content">
        <div class="topbar">
            <h4 class="fw-bold">Submit Booking Request</h4>
        </div>

        <div class="container-fluid mt-4">
            <div class="card-custom">
                <form>
                    <div class="mb-3">
                        <label for="roomSelect" class="form-label">Select Room</label>
                        <select id="roomSelect" name="room" class="form-select" required>
                            <option value="">-- Select a room --</option>
                            <!-- Full list of rooms (example) -->
                            <optgroup label="CICS Building - Floor 5">
                                <option value="CICS-501">CICS-501</option>
                                <option value="CICS-502">CICS-502</option>
                                <option value="CICS-503">CICS-503</option>
                                <option value="CICS-504">CICS-504</option>
                                <option value="CICS-505">CICS-505</option>
                            </optgroup>
                            <optgroup label="CICS Building - Floor 4">
                                <option value="CICS-401">CICS-401</option>
                                <option value="CICS-402">CICS-402</option>
                                <option value="CICS-403">CICS-403</option>
                                <option value="CICS-405">CICS-405</option>
                            </optgroup>
                            <optgroup label="CICS Building - Floor 3">
                                <option value="CICS-301">CICS-301</option>
                                <option value="CICS-302">CICS-302</option>
                                <option value="CICS-303">CICS-303</option>
                                <option value="CICS-304">CICS-304</option>
                                <option value="CICS-305">CICS-305</option>
                            </optgroup>
                            <optgroup label="CICS Building - Floor 2">
                                <option value="CICS-201">CICS-201</option>
                                <option value="CICS-202">CICS-202</option>
                                <option value="CICS-203">CICS-203</option>
                                <option value="CICS-204">CICS-204</option>
                                <option value="CICS-205">CICS-205</option>
                            </optgroup>
                            <optgroup label="CET Building - Floor 5">
                                <option value="AVR">AVR</option>
                                <option value="CET-503">CET-503</option>
                                <option value="LIBRARY">LIBRARY</option>
                            </optgroup>
                            <optgroup label="CET Building - Floor 4">
                                <option value="CET-401">CET-401</option>
                                <option value="CET-402">CET-402</option>
                                <option value="CET-403">CET-403</option>
                                <option value="CET-404">CET-404</option>
                                <option value="CET-405">CET-405</option>
                            </optgroup>
                            <optgroup label="CET Building - Floor 3">
                                <option value="CET-301">CET-301</option>
                                <option value="CET-302">CET-302</option>
                                <option value="CET-303">CET-303</option>
                                <option value="CET-304">CET-304</option>
                                <option value="CET-305">CET-305</option>
                            </optgroup>
                            <optgroup label="CET Building - Floor 2">
                                <option value="CET-203">CET-203</option>
                                <option value="CET-204">CET-204</option>
                                <option value="CET-205">CET-205</option>
                            </optgroup>
                            <optgroup label="CET Building - Floor 1">
                                <option value="CET-101">CET-101</option>
                                <option value="CET-102">CET-102</option>
                                <option value="CET-103">CET-103</option>
                                <option value="CET-104">CET-104</option>
                                <option value="CET-105">CET-105</option>
                            </optgroup>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="dateSelect" class="form-label">Select Date</label>
                        <input type="date" id="dateSelect" name="date" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="startTime" class="form-label">Start Time</label>
                        <input type="time" id="startTime" name="start_time" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="endTime" class="form-label">End Time</label>
                        <input type="time" id="endTime" name="end_time" class="form-control" required>
                    </div>

                    <div class="mb-3">
                        <label for="purpose" class="form-label">Purpose / Activity</label>
                        <textarea id="purpose" name="purpose" class="form-control" rows="3" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-bsu-red">Submit Request</button>
                    <p class="mt-2 text-muted">Notice: Request needs faculty or admin approval.</p>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
