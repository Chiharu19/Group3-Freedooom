<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Faculty Dashboard</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- External CSS -->
  <link rel="stylesheet" href="../faculty-css/faculty_dashboard.css">
</head>

<body>

<!-- Mobile Toggle -->
<div class="sidebar-toggle-label d-md-none">
  <label for="sidebar-toggle" class="m-0">☰ Menu</label>
</div>
<input type="checkbox" id="sidebar-toggle" />

<div class="wrapper">

  <!-- Sidebar -->
  <nav class="sidebar">
    <h3 class="text-center mt-3 mb-4 fw-bold">Faculty</h3>
    <a href="faculty_dashboard.html" class="active">Dashboard</a>
    <a href="room_availability.html">Rooms</a>
    <a href="book_room.html">Book a Room</a>
    <a href="my_bookings.html">My Bookings</a>
    <a href="student_requests.html">Student Requests</a>
    <a href="#" class="mt-3">Logout</a>
  </nav>

  <!-- Main -->
  <main class="main-content">

    <!-- Topbar -->
    <div class="topbar d-flex justify-content-between align-items-center px-4">
      <h4 class="fw-bold m-0">Dashboard</h4>
      <span class="fw-semibold">Welcome, Instructor</span>
    </div>

    <div class="container mt-4">

      <!-- Dashboard Cards -->
      <div class="row g-3">
        <div class="col-md-6">
          <div class="card shadow-sm p-3 text-center card-custom">
            <h5>My Bookings Today</h5>
            <h3 id="dashboard-today-count">0</h3>
            <small id="dashboard-today-list"></small>
          </div>
        </div>

        <div class="col-md-6">
          <div class="card shadow-sm p-3 text-center card-custom">
            <h5>Pending Student Requests</h5>
            <h3 id="dashboard-requests-count">0</h3>
            <small id="dashboard-requests-list"></small>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="mt-4 d-flex gap-2 flex-wrap">
        <a href="book_room.html" class="btn btn-bsu-red px-4 py-2">Book a Room</a>
        <a href="room_availability.html" class="btn btn-outline-secondary px-4 py-2">View Rooms</a>
        <a href="my_bookings.html" class="btn btn-outline-secondary px-4 py-2">My Bookings</a>
      </div>

      <!-- Schedule -->
      <div class="mt-4">
        <h5 class="fw-bold">My Schedule Today</h5>
        <div class="card card-custom p-4 text-center" style="min-height: 200px;">
          <ul id="dashboard-schedule" class="list-unstyled"></ul>
        </div>
      </div>

      <!-- Buildings & Rooms Directory -->
      <div class="mt-5">
        <h4 class="fw-bold mb-3">Buildings & Room Directory</h4>

        <div class="accordion" id="buildingAccordion">

          <!-- CICS Building -->
          <div class="accordion-item card-custom">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#cicsFloors">
                CICS Building
              </button>
            </h2>

            <div id="cicsFloors" class="accordion-collapse collapse">
              <div class="accordion-body">

                <!-- Floors Autogenerated by JS -->
                <div id="cics-floor-list"></div>

              </div>
            </div>
          </div>

          <!-- CET Building -->
          <div class="accordion-item card-custom mt-3">
            <h2 class="accordion-header">
              <button class="accordion-button collapsed" data-bs-toggle="collapse" data-bs-target="#cetFloors">
                CET Building
              </button>
            </h2>

            <div id="cetFloors" class="accordion-collapse collapse">
              <div class="accordion-body">

                <!-- Floors Autogenerated by JS -->
                <div id="cet-floor-list"></div>

              </div>
            </div>
          </div>

        </div>
      </div>

    </div>
  </main>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- App JS -->
<script src="../faculty-js/app.js"></script>

</body>
</html>
