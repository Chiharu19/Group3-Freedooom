<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Dashboard</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="dashboard.css">
</head>

<body>

<div class="wrapper">
    
    <div class="sidebar">
        <h3 class="text-center mt-3 mb-4">Faculty</h3>
        <a href="#" class="active">Dashboard</a>
        <a href="#">Rooms</a>
        <a href="#">Schedules</a>
        <a href="#">Logout</a>
    </div>

    <div class="main-content">

        <div class="topbar d-flex justify-content-between align-items-center px-4">
            <h4 class="fw-bold">Dashboard</h4>
            <span class="fw-semibold">Welcome, Instructor</span>
        </div>

        <div class="container mt-4">

            <div class="row g-3">
                <div class="col-md-6">
                    <div class="card shadow-sm p-3 text-center card-custom">
                        <h5>My Bookings Today</h5>
                        <h3>8</h3>
                    </div>
                </div>

                <div class="col-md-6">
                    <div class="card shadow-sm p-3 text-center card-custom">
                        <h5>Pending Student Requests</h5>
                        <h3>4</h3>
                    </div>
                </div>
            </div>

            <div class="mt-4">
                <a href="book_room.html" class="btn btn-red px-4 py-2">Book a Room</a>
            </div>

            <div class="mt-4">
                <h5 class="fw-bold">My Schedule</h5>
                <div class="card card-custom p-4 text-center" style="height: 300px;">
                    <p>Calendar of your bookings and schedule will appear here.</p>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
