<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="dashboard.css">
    <a href="manage_users.html"></a>
</head>

<body>

<div class="wrapper">
    
    <div class="sidebar">
        <h3 class="text-center mt-3 mb-4">Admin</h3>
        <a href="admin_dashboard.html" class="active">Dashboard</a>
        <a href="manage_room.html">Rooms</a>
        <a href="schedule_room.html">Schedules</a>
        <a href="manage_users.html">Manage Users</a>
        <a href="#">Logout</a>
    </div>

    <div class="main-content">

        <div class="topbar d-flex justify-content-between align-items-center px-4">
            <h4 class="fw-bold">Dashboard</h4>
            <span class="fw-semibold">Welcome, Administrator</span>
        </div>

        <div class="container mt-4">

            <div class="row g-3">
                <div class="col-md-3">
                    <div class="card shadow-sm p-3 text-center card-custom">
                        <h5>Total Rooms</h5>
                        <h3>32</h3>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card shadow-sm p-3 text-center card-custom">
                        <h5>Total Faculty/Staff</h5>
                        <h3>21</h3>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card shadow-sm p-3 text-center card-custom">
                        <h5>Pending Student Requests</h5>
                        <h3>14</h3>
                    </div>
                </div>

                <div class="col-md-3">
                    <div class="card shadow-sm p-3 text-center card-custom">
                        <h5>Today's Bookings</h5>
                        <h3>8</h3>
                    </div>
                </div>
            </div>

            <div class="mt-4 d-flex flex-wrap gap-3">
                <a href="manage_users.html" class="btn btn-red px-4 py-2">Manage Users</a>
                <a href="manage_room.html" class="btn btn-red px-4 py-2">Room Schedules</a>
                <a href="request.html" class="btn btn-red px-4 py-2">Requests</a>
            </div>

            <div class="mt-4">
                <h5 class="fw-bold">Calendar / Timeline</h5>
                <div class="card card-custom p-4 text-center" style="height: 300px;">
                    <p>Calendar or timeline view placeholder</p>
                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
