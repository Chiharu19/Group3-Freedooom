
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Booking</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="edit_booking.css">
</head>

<body>

<div class="wrapper">

    <div class="sidebar">
        <h3 class="text-center mt-3 mb-4">Admin</h3>
        <a href="admin_dashboard.html">Dashboard</a>
        <a href="manage_room.html">Rooms</a>
        <a href="schedule_room.html" class="active">Schedules</a>
        <a href="manage_users.html">Manage Users</a>
        <a href="#">Logout</a>
    </div>

    <div class="main-content">

        <div class="topbar d-flex align-items-center px-4">
            <h5 class="m-0 fw-bold">Edit Booking</h5>
        </div>

        <div class="container py-4">

            <div class="card p-4 shadow-sm">

                <h5 class="fw-bold mb-3">Modify Room Booking</h5>
                <p class="text-muted">Update booking details or cancel this booking.</p>

                <form>

                    <div class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Room</label>
                            <select class="form-select">
                                <option>Room 101</option>
                                <option>Room 204</option>
                                <option>Lab 3</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Date</label>
                            <input type="date" class="form-control">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Faculty</label>
                            <select class="form-select">
                                <option>Dr. Santos</option>
                                <option>Prof. Dela Cruz</option>
                                <option>Mr. Reyes</option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Start Time</label>
                            <input type="time" class="form-control">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">End Time</label>
                            <input type="time" class="form-control">
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Status</label>
                            <select class="form-select">
                                <option>Confirmed</option>
                                <option>Pending</option>
                                <option>Cancelled</option>
                            </select>
                        </div>
                    </div>

                    <div class="mt-4">
                        <label class="form-label">Remarks / Reason for Update</label>
                        <textarea class="form-control" rows="3"></textarea>
                    </div>

                    <div class="d-flex justify-content-between mt-4">
                        <a href="all_schedules.html" class="btn btn-secondary px-4">
                            <i class="fa fa-arrow-left me-2"></i>Back
                        </a>

                        <div>
                            <button type="button" class="btn btn-danger px-4 me-2">
                                <i class="fa fa-times me-2"></i>Cancel Booking
                            </button>

                            <button type="button" class="btn btn-success px-4"
                                    onclick="window.location.href='schedule_room.html'">
                                <i class="fa fa-save me-2"></i> Save Changes
                            </button>
                        </div>
                    </div>

                </form>

            </div>

        </div>
    </div>

</div>

</body>
</html>
