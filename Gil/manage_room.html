<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Rooms</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="manage_room.css">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="wrapper">

    <!-- Sidebar -->
    <div class="sidebar">
        <h3 class="text-center mt-3 mb-4">Admin</h3>
        <a href="admin_dashboard.html">Dashboard</a>
        <a href="#" class="active">Rooms</a>
        <a href="schedule_room.html">Schedules</a>
        <a href="manage_users.html">Manage Users</a>
        <a href="#">Logout</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">

        <!-- Topbar -->
        <div class="topbar d-flex align-items-center px-4">
            <h5 class="m-0 fw-bold">Manage Rooms</h5>
        </div>

        <!-- Page Content -->
        <div class="container py-4">

            <!-- Add Room Button -->
            <div class="mb-3 text-end">
                <button class="btn btn-danger px-4">
                    <i class="fa fa-plus me-2"></i>Add Room
                </button>
            </div>

            <!-- Rooms Table -->
            <div class="card p-3 shadow-sm">
                <h5 class="fw-bold mb-3">Room List</h5>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-secondary">
                            <tr>
                                <th>Room Number</th>
                                <th>Capacity</th>
                                <th>Building</th>
                                <th>Status</th>
                                <th class="text-center">Actions</th>
                            </tr>
                        </thead>

                        <tbody>
                            <tr>
                                <td>101</td>
                                <td>40</td>
                                <td>Main Building</td>
                                <td>
                                    <span class="badge bg-success">Active</span>
                                </td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-primary me-1"><i class="fa fa-edit"></i></button>
                                    <button class="btn btn-sm btn-outline-danger"><i class="fa fa-trash"></i></button>
                                </td>
                            </tr>

                            <tr>
                                <td>204</td>
                                <td>60</td>
                                <td>Science Building</td>
                                <td>
                                    <span class="badge bg-warning text-dark">Under Maintenance</span>
                                </td>
                                <td class="text-center">
                                    <button class="btn btn-sm btn-outline-primary me-1"><i class="fa fa-edit"></i></button>
                                    <button class="btn btn-sm btn-outline-danger"><i class="fa fa-trash"></i></button>
                                </td>
                            </tr>

                        </tbody>
                    </table>
                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
